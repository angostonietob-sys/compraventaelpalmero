<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compraventas El Palmero - Vehículos de Ocasión en Cartagena y Murcia</title>

    <!-- Etiqueta Canónica para evitar duplicidades en Google -->
    <link rel="canonical" href="https://vehiculosdeocasionpalmerocartagenamurcia.es/" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        palmero: {
                            red: '#e03a3a',
                            dark: '#152e4d',
                            sidebar: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- HEADER / NAVEGACIÓN PÚBLICA -->
    <header class="bg-[#0f172a] text-white sticky top-0 z-40 border-b border-slate-800 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="compraventa.jpg" alt="Logo El Palmero" class="h-10 w-20 object-cover rounded border border-slate-700" />
                <div>
                    <h1 class="text-xs font-black uppercase tracking-wider text-[#e03a3a]">Compraventas El Palmero</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Vehículos de Ocasión</p>
                </div>
            </div>
            <a href="admin.html" class="text-xs font-bold text-slate-400 hover:text-white transition uppercase tracking-wider">
                <i class="fa-solid fa-lock mr-1"></i> Admin
            </a>
        </div>
    </header>

    <!-- HERO / PORTADA -->
    <section class="bg-[#152e4d] text-white py-12 px-4 text-center space-y-4">
        <div class="max-w-3xl mx-auto space-y-2">
            <h2 class="text-2xl sm:text-4xl font-black uppercase tracking-tight">Encuentra tu próximo vehículo</h2>
            <p class="text-xs sm:text-sm text-slate-300 font-medium">Calidad, confianza y garantía en Cartagena y Murcia.</p>
        </div>
    </section>

    <!-- CATÁLOGO DE COCHES PÚBLICO -->
    <main class="max-w-7xl mx-auto px-4 py-10 space-y-6">
        <div class="flex justify-between items-center border-b border-slate-200 pb-4">
            <h3 class="text-base sm:text-lg font-black uppercase text-[#152e4d]">Stock Disponible</h3>
            <span id="contadorCoches" class="text-xs font-bold text-slate-400 uppercase">Cargando vehículos...</span>
        </div>

        <!-- Contenedor donde se pintan las tarjetas de los coches -->
        <div id="publicCarsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="text-xs text-slate-400 col-span-full text-center py-10">Cargando catálogo...</p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#0f172a] text-slate-400 py-8 px-4 text-center text-xs space-y-2 border-t border-slate-800 mt-20">
        <p class="font-bold uppercase tracking-wider text-white">Compraventas El Palmero</p>
        <p> Cartagena y Murcia</p>
    </footer>

    <!-- SCRIPT DE FIREBASE Y PINTADO PÚBLICO -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBaKF2UIogxicJYsDR1Un4n7fPg80s-J_g",
            authDomain: "compraventaelpalmero.firebaseapp.com",
            projectId: "compraventaelpalmero",
            storageBucket: "compraventaelpalmero.firebasestorage.app",
            messagingSenderId: "954644373383",
            appId: "1:954644373383:web:03e0a66fea805def2abd22"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const dbPublic = firebase.firestore();

        // Cargar coches en la web pública optimizados con lazy loading
        dbPublic.collection('coches').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
            const grid = document.getElementById('publicCarsGrid');
            const contador = document.getElementById('contadorCoches');
            grid.innerHTML = '';

            if (snapshot.empty) {
                grid.innerHTML = `<p class="text-xs text-slate-400 col-span-full text-center py-10">No hay vehículos disponibles en este momento.</p>`;
                contador.textContent = '0 vehículos';
                return;
            }

            contador.textContent = `${snapshot.size} vehículo${snapshot.size === 1 ? '' : 's'} disponible${snapshot.size === 1 ? '' : 's'}`;

            snapshot.forEach(doc => {
                const c = doc.data();
                const price = Number(c.price || 0).toLocaleString('es-ES');
                
                let kmNum = Number(String(c.km || 0).replace(/\./g, '').replace(/,/g, ''));
                if (kmNum > 0 && kmNum < 1000) kmNum = kmNum * 1000;
                const kmFormatted = isNaN(kmNum) || kmNum === 0 ? c.km : kmNum.toLocaleString('es-ES');
                
                const imgUrl = (c.images && c.images.length > 0) ? c.images[0] : (c.image || '');

                grid.innerHTML += `
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                        <div>
                            <!-- loading="lazy" añadido para que la carga de la web vuele -->
                            <img src="${imgUrl}" loading="lazy" class="w-full h-48 object-cover border-b border-slate-100" onerror="this.src='https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600'" />
                            <div class="p-5 space-y-3">
                                <h4 class="text-sm font-black uppercase text-[#152e4d] truncate">${c.title || 'Vehículo de ocasión'}</h4>
                                <div class="flex justify-between items-center text-xs font-bold text-slate-500">
                                    <span>📅 ${c.year || 'N/A'}</span>
                                    <span>🛣️ ${kmFormatted} km</span>
                                    <span class="bg-slate-100 px-2 py-0.5 rounded text-[10px] uppercase">${c.fuel || ''}</span>
                                </div>
                            </div>
                        </div>
                        <div class="p-5 pt-0 flex justify-between items-center border-t border-slate-100 mt-4">
                            <span class="text-base font-black text-[#e03a3a]">${price} €</span>
                            <a href="tel:600000000" class="bg-[#152e4d] hover:bg-slate-800 text-white font-bold py-2 px-4 rounded-xl text-xs uppercase transition">
                                Contactar
                            </a>
                        </div>
                    </div>
                `;
            });
        });
    </script>
</body>

</html>
